name: Sync Wiki from Source

on:
  push:
    paths:
      - 'wiki/**'
    branches:
      - claude/react-comprehensive-app-gYw6r
      - main

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config --global user.name "Wiki Sync Bot"
          git config --global user.email "noreply@github.com"

      - name: Clone wiki repository
        run: |
          git clone https://github.com/S2Sys/React101.wiki.git wiki-repo
          cd wiki-repo
          ls -la

      - name: Copy wiki files
        run: |
          cd wiki-repo
          cp ../wiki/*.md ./
          ls -la *.md

      - name: Create sidebar navigation
        run: |
          cd wiki-repo
          printf '# React101 Wiki\n\n## Beginner\n- **[Home](Home)**\n- **[Quick Start](01-quick-start)**\n- **[Architecture](02-architecture)**\n- **[Hooks Guide](03-hooks-guide)**\n- **[State Management](04-state-management)**\n- **[Components](05-components-guide)**\n\n## Intermediate\n- **[Custom Hooks](06-custom-hooks)**\n- **[Pages & Features](07-pages-features)**\n- **[Authentication](08-authentication)**\n- **[CRUD Operations](09-crud-operations)**\n- **[Form Handling](10-form-handling)**\n- **[Mock API](11-mock-api)**\n- **[Styling](12-styling)**\n\n## Advanced\n- **[Performance](13-performance)**\n- **[Error Handling](14-error-handling)**\n- **[TypeScript](15-typescript)**\n- **[Testing](16-testing)**\n- **[Best Practices](17-best-practices)**\n- **[Troubleshooting](18-troubleshooting)**\n\n## Reference\n- **[FAQ](19-faq)**\n- **[Advanced FAQ](20-advanced-faq)**\n\n---\nStatus: Auto-synced from source repository\n' > _Sidebar.md

      - name: Check for changes
        run: |
          cd wiki-repo
          git status

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-repo
          if [[ $(git status -s) ]]; then
            git add *.md _Sidebar.md
            git commit -m "Auto-sync wiki from source repository" || true
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/S2Sys/React101.wiki.git master
            echo "Wiki synced successfully!"
          else
            echo "No changes to sync"
          fi

      - name: Sync completed
        run: echo "Wiki sync completed at $(date)"
